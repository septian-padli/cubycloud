                  name: filename
                  required: false
                  schema:
                    type: string
                - description: When exactly true, request a unique filename.
                  in: query
                  name: unique_name
                  required: false
                  schema:
                    default: false
                    type: boolean
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                            required:
                                - file
                            type: object
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SharedNode'
                    description: Uploaded item
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Missing file or malformed multipart request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                    invalid unlock: null
                    or password required: null
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The share link does not grant editor permission
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link or destination folder not found
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link has expired
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Upload failed
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Upload to a public shared folder
    /api/v1/setup/complete:
        post:
            description: Initializes the SUPER_ADMIN account and selected storage configuration. This endpoint is protected by setupGuard, not normal user authentication, and is available only before setup has completed. At least one local storage node must be enabled unless cloud storage is enabled. Enabled local paths may be created if missing and must be writable; enabled cloud credentials are validated. On success, the endpoint sets a 24-hour `cuby_token` HttpOnly, SameSite=Lax cookie, Secure when applicable.
            operationId: completeSetup
            requestBody:
                content:
                    application/json:
                        example:
                            admin:
                                email: admin@example.com
                                password: initial-secure-password
                                recovery_key: ABCDE-FGHIJ-KLMNP-QRSTU-VWXYZ-23456
                                username: admin
                            cloud:
                                access_key: EXAMPLEACCESSKEY
                                bucket: cubycloud-data
                                capacity_cap_gb: 0
                                enabled: false
                                endpoint: https://s3.example.com
                                node_name: s3-primary
                                provider: S3_COMPATIBLE
                                region: us-east-1
                                secret_key: example-secret-key
                            placement_strategy: balanced
                            storage_nodes:
                                - capacity_bytes: 1099511627776
                                  enabled: true
                                  path: /srv/cubycloud/storage/default
                        schema:
                            $ref: '#/components/schemas/CompleteSetupRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                recovery_key: ABCDE-FGHIJ-KLMNP-QRSTU-VWXYZ-23456
                                redirect: /drive/home
                            schema:
                                $ref: '#/components/schemas/CompleteSetupResponse'
                    description: Setup completed; response includes the supplied recovery key and client redirect path.
                    headers:
                        Set-Cookie:
                            description: Sets the `cuby_token` cookie with Path=/, HttpOnly, SameSite=Lax, a 24-hour lifetime, and Secure when applicable.
                            schema:
                                type: string
                "400":
                    content:
                        application/json:
                            example:
                                error: at least one storage node must be enabled
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid request or setup values, duplicate username/email, invalid recovery key, password shorter than 8 characters, no enabled local or cloud storage, unwritable local path, or invalid cloud credentials.
                "403":
                    content:
                        application/json:
                            example:
                                error: setup already completed
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Setup has already completed; setupGuard prevents another initialization.
                "500":
                    content:
                        application/json:
                            example:
                                error: setup failed
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Setup initialization, storage configuration, or token generation failed.
            security: []
            summary: Complete initial setup
    /api/v1/setup/scan-nodes:
        get:
            description: Publicly scans local storage directories for candidate nodes and reports detected capacity and free space. If the storage directory has no readable candidates, the backend may return a default DATA_DIR candidate or an empty nodes array. The devices array is currently empty.
            operationId: scanSetupStorageNodes
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                devices: []
                                nodes:
                                    - capacity_bytes: 1099511627776
                                      free_bytes: 536870912000
                                      kind: HDD
                                      path: /srv/cubycloud/storage/default
                            schema:
                                $ref: '#/components/schemas/ScanNodesResponse'
                    description: Scanned storage candidates; nodes may be empty.
                "500":
                    content:
                        application/json:
                            example:
                                error: scan failed
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Storage candidates could not be scanned.
            security: []
            summary: Scan for local storage nodes
    /api/v1/setup/status:
        get:
            description: Returns whether initial setup has completed. This endpoint is public.
            operationId: getSetupStatus
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                is_setup_completed: false
                            schema:
                                $ref: '#/components/schemas/SetupStatusResponse'
                    description: Setup status.
                "500":
                    content:
                        application/json:
                            example:
                                error: failed to get setup status
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Setup status could not be retrieved.
            security: []
            summary: Get initial setup status
    /api/v1/setup/test-cloud:
        post:
            description: Validates S3-compatible cloud storage connectivity and credentials without storing them. Available only before setup has completed.
            operationId: testSetupCloud
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetupCloudConfig'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                message: cloud connection successful
                            schema:
                                properties:
                                    message:
                                        type: string
                                required:
                                    - message
                                type: object
                    description: Cloud connection test succeeded.
                "400":
                    content:
                        application/json:
                            example:
                                error: cloud connection validation failed
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Cloud configuration missing required fields or connection validation failed.
                "403":
                    content:
                        application/json:
                            example:
                                error: setup already completed
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Setup has already completed.
            security: []
            summary: Test cloud storage connection before completing setup
    /api/v1/share/users:
        get:
            description: Searches users for the share autocomplete, excluding the authenticated user. An empty query returns up to 20 users.
            operationId: searchShareUsers
            parameters:
                - description: Optional substring matched against usernames and email addresses.
                  example: alex
                  in: query
                  name: q
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                users:
                                    - email: alex@example.com
                                      id: usr_01JABCDEF
                                      username: alex
                            schema:
                                $ref: '#/components/schemas/ShareUserSearchResponse'
                    description: Matching users, ordered by username, limited to 20.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Failed to search users
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Search users for sharing
    /health:
        get:
            description: Returns `ok` when all configured storage nodes are available; otherwise returns `unavailable` with HTTP 503.
            operationId: getHealth
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                status: ok
                            schema:
                                $ref: '#/components/schemas/HealthResponse'
                    description: All configured nodes are available.
                "503":
                    content:
                        application/json:
                            example:
                                status: unavailable
                            schema:
                                $ref: '#/components/schemas/HealthResponse'
                    description: One or more configured nodes are unavailable.
            security: []
            summary: Check storage node health
            tags:
                - Core
security:
    - CookieAuth: []
    - BearerAuth: []
