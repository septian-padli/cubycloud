                    example: 720
                    format: int64
                    type: integer
                id:
                    example: node-01
                    type: string
                kind:
                    HDD: null
                    description: Storage medium kind (for example SSD
                    example: SSD
                    or S3).: null
                    type: string
                migration_job_id:
                    example: job-123
                    type: string
                migration_status:
                    example: in_progress
                    type: string
                name:
                    example: Primary disk
                    type: string
                path:
                    example: /srv/cubycloud
                    type: string
                region:
                    example: us-east-1
                    type: string
                safe_to_disconnect:
                    example: false
                    type: boolean
                total_gb:
                    example: 1000
                    format: int64
                    type: integer
                type:
                    example: local
                    type: string
                used_bytes:
                    example: 300647710720
                    format: int64
                    type: integer
            required:
                - id
                - type
                - name
                - path
                - kind
                - total_gb
                - free_gb
                - capacity_cap_gb
                - used_bytes
                - enabled
                - safe_to_disconnect
            type: object
        StorageNodeScan:
            properties:
                capacity_bytes:
                    description: Total capacity in bytes.
                    example: 1099511627776
                    format: int64
                    type: integer
                free_bytes:
                    description: Available capacity in bytes.
                    example: 536870912000
                    format: int64
                    type: integer
                kind:
                    description: Disk kind detected for the candidate path.
                    example: HDD
                    type: string
                path:
                    description: Candidate storage path.
                    example: /srv/cubycloud/storage/default
                    type: string
            required:
                - path
                - kind
                - capacity_bytes
                - free_bytes
            type: object
        StorageNodesList:
            properties:
                nodes:
                    items:
                        $ref: '#/components/schemas/StorageNode'
                    type: array
            required:
                - nodes
            type: object
        SystemSettings:
            properties:
                audit_retention_days:
                    enum:
                        - 7
                        - 14
                        - 30
                        - 60
                        - 90
                    example: 90
                    type: integer
                default_quota:
                    $ref: '#/components/schemas/AdminQuotaPolicy'
                placement_strategy:
                    enum:
                        - FILL_FIRST
                        - ROUND_ROBIN
                        - MOST_FREE_SPACE
                    example: FILL_FIRST
                    type: string
                worker_concurrency:
                    example: 2
                    maximum: 10
                    minimum: 1
                    type: integer
            required:
                - default_quota
                - audit_retention_days
                - worker_concurrency
                - placement_strategy
            type: object
        TrashItem:
            properties:
                days_remaining:
                    type: integer
                deleted_at:
                    format: date-time
                    type: string
                id:
                    type: string
                kind:
                    enum:
                        - file
                        - folder
                    type: string
                modified_at:
                    format: date-time
                    type: string
                name:
                    type: string
                original_parent_missing:
                    type: boolean
                parent_id:
                    type:
                        - string
                        - "null"
                size_bytes:
                    format: int64
                    type: integer
            required:
                - id
                - name
                - kind
                - size_bytes
                - parent_id
                - modified_at
                - deleted_at
                - days_remaining
                - original_parent_missing
            type: object
        TrashListResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/TrashItem'
                    type: array
            required:
                - items
            type: object
        TrashRestoreRequest:
            properties:
                to_root:
                    description: Force restoration to the root folder.
                    type: boolean
            type: object
        TrashRestoreResponse:
            properties:
                item:
                    properties:
                        id:
                            type: string
                        kind:
                            enum:
                                - file
                                - folder
                            type: string
                        modified_at:
                            format: date-time
                            type: string
                        name:
                            type: string
                        parent_id:
                            type:
                                - string
                                - "null"
                        size_bytes:
                            format: int64
                            type: integer
                    required:
                        - id
                        - name
                        - kind
                        - size_bytes
                        - parent_id
                        - modified_at
                    type: object
                restored_to_root:
                    type: boolean
            required:
                - item
                - restored_to_root
            type: object
        TusCreateHeaders:
            properties:
                Tus-Resumable:
                    enum:
                        - 1.0.0
                    type: string
                Upload-Length:
                    format: int64
                    minimum: 0
                    type: integer
                Upload-Metadata:
                    and checksum.: null
                    description: Base64 encoded metadata values; supported keys include filename
                    parent_id: null
                    type: string
            required:
                - Upload-Length
                - Tus-Resumable
            type: object
        TusOffsetHeaders:
            properties:
                Tus-Resumable:
                    enum:
                        - 1.0.0
                    type: string
                Upload-Length:
                    format: int64
                    type: integer
                Upload-Offset:
                    format: int64
                    type: integer
            required:
                - Upload-Offset
                - Tus-Resumable
            type: object
        TusOptionsHeaders:
            properties:
                Tus-Extension:
                    example: creation,termination,checksum
                    type: string
                Tus-Resumable:
                    example: 1.0.0
                    type: string
                Tus-Version:
                    example: 1.0.0
                    type: string
            type: object
        TusUploadItem:
            contentEncoding: base64
            description: Base64-encoded JSON representation of the completed OrganizationItem, returned in the Upload-Item response header when available.
            example: eyJpZCI6IjAxSkdGOV...
            type: string
        UpdateAdminUserQuotaRequest:
            properties:
                quota_gb:
                    example: 100
                    format: double
                    type: number
                quota_mode:
                    example: CUSTOM
                    type: string
            required:
                - quota_mode
            type: object
        UpdateProfileRequest:
            description: Supply display_name and/or email to update. Null or omitted fields are not changed; changing email requires current_password.
            properties:
                current_password:
                    description: Required and verified only when changing the email address.
                    example: current-secure-password
                    format: password
                    type: string
                display_name:
                    description: New display name, 1 to 100 characters after trimming.
                    example: Alex Example
                    type: string
                email:
                    description: New email address. Changing it requires current_password; the current value can be supplied without a password and causes no email update.
                    example: alex@example.com
                    format: email
                    type: string
            type: object
        UpdateStorageNodeRequest:
            description: Fields are optional; update only the supplied node properties.
            properties:
                capacity_cap_gb:
                    example: 1500
                    format: int64
                    type: integer
                enabled:
                    example: true
                    type: boolean
                name:
                    example: Archive disk
                    type: string
            type: object
        UpdateSystemSettingsRequest:
            description: All fields are optional; supplied fields update the corresponding setting.
            example:
                audit_retention_days: 90
                default_quota:
                    gb: 50
                    mode: limited
                placement_strategy: FILL_FIRST
                worker_concurrency: 2
            properties:
                audit_retention_days:
                    enum:
                        - 7
                        - 14
                        - 30
                        - 60
                        - 90
                    type: integer
                default_quota:
                    $ref: '#/components/schemas/AdminQuotaPolicy'
                placement_strategy:
                    enum:
                        - FILL_FIRST
                        - ROUND_ROBIN
                        - MOST_FREE_SPACE
                    type: string
                worker_concurrency:
                    maximum: 10
                    minimum: 1
                    type: integer
            type: object
        UploadIntentRequest:
            properties:
                filename:
                    example: archive.zip
                    type: string
                parent_id:
                    type:
                        - string
                        - "null"
                size:
                    example: 104857600
                    format: int64
                    minimum: 0
                    type: integer
                unique_name:
                    default: false
                    type: boolean
            required:
                - filename
                - size
            type: object
        UploadIntentResponse:
            properties:
                expires_at:
                    format: date-time
                    type: string
                method:
                    example: PUT
                    type: string
                placement:
                    enum:
                        - local
                        - s3
                    type: string
                upload_id:
                    type: string
                url:
                    format: uri
                    type: string
            required:
                - placement
            type: object
        UploadSyncRequest:
            properties:
                upload_id:
                    type: string
            required:
                - upload_id
            type: object
    securitySchemes:
        BearerAuth:
            bearerFormat: JWT
            description: |
                Fallback JWT bearer token passed in `Authorization: Bearer <token>` header.
            scheme: bearer
            type: http
        CookieAuth:
            description: |
                HTTP-only signed JWT session cookie (`cuby_token`).
                Automatically sent by browser requests in Swagger UI "Try it out".
            in: cookie
            name: cuby_token
            type: apiKey
info:
    description: |
        Comprehensive HTTP API documentation for **CubyCloud**, a self-hosted single-container cloud storage platform.

        ### Authentication & Sessions
        CubyCloud uses HTTP-only cookie session authentication (`cuby_token`).
        Interactive API exploration via **Try it out** automatically sends this cookie from your active browser session.
        A fallback `Authorization: Bearer <token>` header is also supported.

        ### Role Access Control
        - **Public**: Endpoints accessible without authentication (e.g. `/health`, setup status, public links).
        - **Authenticated**: Endpoints requiring an active user session (`USER` or `SUPER_ADMIN` role).
        - **Super Admin Only**: Endpoints restricted strictly to users with the `SUPER_ADMIN` role (e.g. `/api/v1/admin/*`, `/api/docs/*`).
    title: CubyCloud API
    version: 1.0.0
openapi: 3.1.0
paths:
    /api/docs:
        get:
            description: Super Admin role required. Returns the interactive Swagger UI HTML page. Non-Super Admin users receive 403 Forbidden.
            operationId: getApiDocs
            responses:
                "200":
                    content:
                        text/html:
                            schema:
                                type: string
                    description: Swagger UI HTML.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Super Admin role required.
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Open interactive API documentation
            tags:
                - Documentation
    /api/docs/openapi.yaml:
        get:
            description: Super Admin role required. Returns the OpenAPI YAML document. Non-Super Admin users receive 403 Forbidden.
            operationId: getApiOpenApiYaml
            responses:
                "200":
                    content:
                        application/yaml:
                            schema:
                                type: string
                    description: OpenAPI specification in YAML format.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Super Admin role required.
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Download the OpenAPI specification
            tags:
                - Documentation
    /api/v1/admin/audit-logs:
        get:
            description: Returns audit logs ordered by creation time descending. Requires the SUPER_ADMIN role; authenticated regular users receive 403 Forbidden.
            operationId: listAdminAuditLogs
            parameters:
                - description: Page size; defaults to 50 and is bounded to 1 through 200.
                  example: 50
                  in: query
                  name: limit
                  required: false
                  schema:
                    default: 50
                    maximum: 200
                    minimum: 1
                    type: integer
                - description: Zero-based result offset; negative or unparsable values use zero.
                  example: 0
                  in: query
                  name: offset
                  required: false
                  schema:
                    default: 0
                    minimum: 0
                    type: integer
                - description: Filter by exact action value.
                  example: settings.update
                  in: query
                  name: action
                  required: false
                  schema:
                    type: string
                - description: Filter by exact user ID.
                  example: user-123
                  in: query
                  name: user_id
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditLogs'
                    description: Matching audit log entries
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: SUPER_ADMIN role required
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Failed to retrieve audit logs
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Query audit logs
    /api/v1/admin/backup:
        get:
            description: Streams a SQLite database backup file. Requires the SUPER_ADMIN role; authenticated regular users receive 403 Forbidden.
            operationId: downloadAdminDatabaseBackup
            responses:
                "200":
                    content:
                        application/octet-stream:
                            schema:
                                format: binary
                                type: string
                    description: SQLite database backup file
                    headers:
                        Content-Disposition:
                            description: Attachment filename.
                            example: attachment; filename=cubycloud.db
                            schema:
                                type: string
                        Content-Length:
                            description: Backup file size in bytes.
                            example: 524288
                            schema:
                                type: integer
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: SUPER_ADMIN role required
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Failed to produce or stream database backup
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Download database backup
    /api/v1/admin/settings:
        get:
            description: Returns system settings. Requires the SUPER_ADMIN role; authenticated regular users receive 403 Forbidden.
            operationId: getAdminSettings
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                audit_retention_days: 90
                                default_quota:
                                    gb: 50
                                    mode: limited
                                placement_strategy: FILL_FIRST
                                worker_concurrency: 2
                            schema:
                                $ref: '#/components/schemas/SystemSettings'
                    description: Current system settings
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: SUPER_ADMIN role required
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Failed to retrieve settings
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Get system settings
        put:
            description: Updates supplied settings and returns the resulting settings. Requires the SUPER_ADMIN role; authenticated regular users receive 403 Forbidden.
            operationId: updateAdminSettings
            requestBody:
                content:
                    application/json:
                        example:
                            audit_retention_days: 90
                            default_quota:
                                gb: 50
                                mode: limited
                            placement_strategy: FILL_FIRST
                            worker_concurrency: 2
                        schema:
                            $ref: '#/components/schemas/UpdateSystemSettingsRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SystemSettings'
                    description: Updated system settings
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid request or setting value
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: SUPER_ADMIN role required
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Settings update succeeded but retrieval failed
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Update system settings
    /api/v1/admin/storage-nodes:
        get:
            description: Returns storage nodes with capacity and status information. Requires the SUPER_ADMIN role; authenticated regular users receive 403 Forbidden.
            operationId: listAdminStorageNodes
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StorageNodesList'
                    description: Storage nodes
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: SUPER_ADMIN role required
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Failed to retrieve storage nodes
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: List storage nodes
        post:
            description: Adds a local disk storage node. Requires the SUPER_ADMIN role; authenticated regular users receive 403 Forbidden.
            operationId: createStorageNodeLocal
            requestBody:
                content:
                    application/json:
                        example:
                            capacity_cap_gb: 1000
                            enabled: true
                            name: Primary disk
                            path: /srv/cubycloud
                        schema:
                            $ref: '#/components/schemas/CreateLocalStorageNodeRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StorageNode'
                    description: Storage node created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid request or node configuration
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: SUPER_ADMIN role required
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A node with that name already exists
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Failed to create node
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Create a local storage node
    /api/v1/admin/storage-nodes/{id}:
        delete:
            description: Soft-deletes the specified storage node. Requires the SUPER_ADMIN role; authenticated regular users receive 403 Forbidden.
            operationId: deleteStorageNode
            parameters:
                - description: Storage node ID
                  example: node-01
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                message: node deleted successfully
                            schema:
                                $ref: '#/components/schemas/AdminMessageResponse'
                    description: Node deleted
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid node ID
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: SUPER_ADMIN role required
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Storage node not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Failed to delete node
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Delete a storage node
        put:
            description: Updates supplied storage-node properties. Requires the SUPER_ADMIN role; authenticated regular users receive 403 Forbidden.
            operationId: updateStorageNode
            parameters:
                - description: Storage node ID
                  example: node-01
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        example:
                            capacity_cap_gb: 1500
                            enabled: true
                        schema:
                            $ref: '#/components/schemas/UpdateStorageNodeRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminMessageResponse'
                    description: Node updated
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid request or node configuration
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: SUPER_ADMIN role required
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Storage node not found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Node name already exists
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Failed to update node
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Update storage node configuration
    /api/v1/admin/storage-nodes/{id}/detach:
        post:
            description: Disables a node and starts physical migration. Requires the SUPER_ADMIN role; authenticated regular users receive 403 Forbidden.
            operationId: detachStorageNode
            parameters:
                - description: Storage node ID
                  example: node-01
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        example:
                            target_node_id: node-02
                        schema:
                            $ref: '#/components/schemas/DetachStorageNodeRequest'
                required: false
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetachStorageNodeResponse'
                    description: Detach operation result
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid node ID or detach operation rejected
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: SUPER_ADMIN role required
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Detach a storage node
    /api/v1/admin/storage-nodes/{id}/disable:
        put:
            description: Disables the specified storage node. Requires the SUPER_ADMIN role; authenticated regular users receive 403 Forbidden.
            operationId: disableStorageNode
            parameters:
                - description: Storage node ID
                  example: node-01
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                message: node disabled successfully
                            schema:
                                $ref: '#/components/schemas/AdminMessageResponse'
                    description: Node disabled
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid node ID or node cannot be disabled
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: SUPER_ADMIN role required
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Disable a storage node
    /api/v1/admin/storage-nodes/cloud:
        post:
            description: Adds an S3-compatible cloud storage node. Requires the SUPER_ADMIN role; authenticated regular users receive 403 Forbidden.
            operationId: createStorageNodeCloud
            requestBody:
                content:
                    application/json:
                        example:
                            access_key: AKIAIOSFODNN7EXAMPLE
                            bucket: cubycloud-data
                            capacity_cap_gb: 2000
                            enabled: true
                            endpoint: https://s3.example.com
                            name: Offsite backup
                            region: us-east-1
                            secret_key: example-secret-key
                        schema:
