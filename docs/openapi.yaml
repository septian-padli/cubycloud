components:
    schemas:
        AccessRequest:
            properties:
                item_id:
                    type: string
                source:
                    default: my-storage
                    enum:
                        - my-storage
                        - organization
                    type: string
            required:
                - item_id
            type: object
        AccessResponse:
            properties:
                ok:
                    example: true
                    type: boolean
            required:
                - ok
            type: object
        AdminMessageResponse:
            properties:
                message:
                    example: Operation completed successfully
                    type: string
            required:
                - message
            type: object
        AdminQuotaPolicy:
            properties:
                gb:
                    description: Quota in GB when mode is limited; zero when unlimited.
                    example: 50
                    type: integer
                mode:
                    enum:
                        - limited
                        - unlimited
                    example: limited
                    type: string
            required:
                - mode
                - gb
            type: object
        AdminStorageCategoryUsage:
            properties:
                bytes:
                    example: 1073741824
                    format: int64
                    type: integer
                id:
                    example: video
                    type: string
                label:
                    example: Video
                    type: string
                used_gb:
                    example: 1
                    format: double
                    type: number
            required:
                - id
                - label
                - bytes
                - used_gb
            type: object
        AdminStorageStats:
            properties:
                categories:
                    items:
                        $ref: '#/components/schemas/AdminStorageCategoryUsage'
                    type: array
                free_bytes:
                    example: 751619276800
                    format: int64
                    type: integer
                free_gb:
                    example: 700
                    format: double
                    type: number
                nodes_count:
                    example: 2
                    type: integer
                total_capacity_bytes:
                    example: 1073741824000
                    format: int64
                    type: integer
                total_capacity_gb:
                    example: 1000
                    format: double
                    type: number
                total_used_bytes:
                    example: 322122547200
                    format: int64
                    type: integer
                total_used_gb:
                    example: 300
                    format: double
                    type: number
            required:
                - total_capacity_bytes
                - total_capacity_gb
                - total_used_bytes
                - total_used_gb
                - free_bytes
                - free_gb
                - nodes_count
                - categories
            type: object
        AdminTopStorageUser:
            properties:
                created_at:
                    example: "2026-01-15T10:30:00Z"
                    format: date-time
                    type: string
                email:
                    example: alice@example.com
                    format: email
                    type: string
                id:
                    example: user-123
                    type: string
                quota_bytes:
                    description: Quota limit in bytes; -1 denotes unlimited.
                    example: 53687091200
                    format: int64
                    type: integer
                quota_gb:
                    example: 50
                    format: double
                    type: number
                quota_mode:
                    example: DEFAULT
                    type: string
                role:
                    example: REGULAR
                    type: string
                used_bytes:
                    example: 1073741824
                    format: int64
                    type: integer
                used_gb:
                    example: 1
                    format: double
                    type: number
                username:
                    example: alice
                    type: string
            required:
                - id
                - username
                - email
                - role
                - quota_mode
                - quota_bytes
                - used_bytes
                - used_gb
                - created_at
            type: object
        AdminTopStorageUsers:
            properties:
                has_more:
                    example: true
                    type: boolean
                items:
                    items:
                        $ref: '#/components/schemas/AdminTopStorageUser'
                    type: array
                next_offset:
                    example: 20
                    type: integer
                total:
                    example: 42
                    format: int64
                    type: integer
            required:
                - items
                - total
                - has_more
                - next_offset
            type: object
        AdminUser:
            properties:
                created_at:
                    example: "2026-01-15T10:30:00Z"
                    format: date-time
                    type: string
                email:
                    example: alice@example.com
                    format: email
                    type: string
                id:
                    example: user-123
                    type: string
                invitation_token:
                    example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                    type: string
                invitation_url:
                    example: /set-password#token=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                    type: string
                quota_bytes:
                    description: Quota limit in bytes; -1 denotes unlimited.
                    example: 53687091200
                    format: int64
                    type: integer
                quota_gb:
                    example: 50
                    format: double
                    type: number
                quota_mode:
                    example: DEFAULT
                    type: string
                role:
                    example: REGULAR
                    type: string
                status:
                    enum:
                        - ACTIVE
                        - PENDING_ACTIVATION
                    example: ACTIVE
                    type: string
                used_bytes:
                    example: 1073741824
                    format: int64
                    type: integer
                used_gb:
                    example: 1
                    format: double
                    type: number
                username:
                    example: alice
                    type: string
            required:
                - id
                - username
                - email
                - role
                - status
                - quota_mode
                - quota_bytes
                - used_bytes
                - used_gb
                - created_at
            type: object
        AdminUserInvitationResponse:
            properties:
                expires_at:
                    example: "2026-01-16T10:30:00Z"
                    format: date-time
                    type: string
                invitation_token:
                    example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                    type: string
                invitation_url:
                    example: /set-password#token=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                    type: string
            required:
                - invitation_token
                - invitation_url
                - expires_at
            type: object
        AdminUserResetPasswordResponse:
            properties:
                expires_at:
                    example: "2026-01-15T11:00:00Z"
                    format: date-time
                    type: string
                message:
                    example: password reset link generated
                    type: string
                reset_token:
                    example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                    type: string
                reset_url:
                    example: /set-password#token=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                    type: string
            required:
                - reset_token
                - reset_url
                - expires_at
                - message
            type: object
        AdminUsersList:
            properties:
                users:
                    items:
                        $ref: '#/components/schemas/AdminUser'
                    type: array
            required:
                - users
            type: object
        AuditLog:
            properties:
                action:
                    example: settings.update
                    type: string
                created_at:
                    example: "2026-01-15T10:30:00Z"
                    type: string
                details:
                    example: Updated worker concurrency
                    nullable: true
                    type: string
                error_message:
                    example: null
                    nullable: true
                    type: string
                id:
                    example: log-123
                    type: string
                ip_address:
                    example: 192.0.2.10
                    nullable: true
                    type: string
                method:
                    example: PUT
                    type: string
                path:
                    example: /api/v1/admin/settings
                    type: string
                status_code:
                    example: 200
                    type: integer
                user_agent:
                    example: Mozilla/5.0
                    nullable: true
                    type: string
                user_id:
                    example: user-123
                    nullable: true
                    type: string
            required:
                - id
                - method
                - path
                - status_code
                - action
                - created_at
            type: object
        AuditLogs:
            items:
                $ref: '#/components/schemas/AuditLog'
            type: array
        AuthUser:
            properties:
                display_name:
                    example: System Administrator
                    type: string
                email:
                    example: admin@example.com
                    format: email
                    type: string
                id:
                    description: User identifier.
                    example: 01J8X2K6R5G4M3N2P1Q0ABCDEFG
                    type: string
                quota_bytes:
                    description: Quota in bytes; SUPER_ADMIN accounts are returned with -1 for unlimited quota.
                    example: -1
                    format: int64
                    type: integer
                role:
                    description: Assigned user role.
                    example: SUPER_ADMIN
                    type: string
                used_bytes:
                    description: Deduplicated file usage in bytes.
                    example: 1073741824
                    format: int64
                    type: integer
                username:
                    example: admin
                    type: string
            required:
                - id
                - username
                - email
                - display_name
                - role
                - quota_bytes
                - used_bytes
            type: object
        BatchCompressRequest:
            properties:
                ids:
                    items:
                        type: string
                    minItems: 1
                    type: array
                name:
                    type: string
                parent_id:
                    type:
                        - string
                        - "null"
            required:
                - ids
            type: object
        BatchDownloadRequest:
            properties:
                ids:
                    items:
                        type: string
                    minItems: 1
                    type: array
            required:
                - ids
            type: object
        Breadcrumb:
            properties:
                id:
                    example: 01JQ2Z5X7K9M3N4P6R8T0V1W2Y
                    type: string
                name:
                    example: Documents
                    type: string
                parent_id:
                    example: null
                    type:
                        - string
                        - "null"
            required:
                - id
                - name
            type: object
        CategoryUsageResponse:
            properties:
                categories:
                    items:
                        $ref: '#/components/schemas/StorageCategoryUsage'
                    type: array
                total_bytes:
                    format: int64
                    type: integer
                total_gb:
                    format: double
                    type: number
            required:
                - total_bytes
                - total_gb
                - categories
            type: object
        ChangePasswordRequest:
            properties:
                confirm_password:
                    description: Must exactly match new_password.
                    example: replacement-password
                    format: password
                    type: string
                current_password:
                    description: Current account password.
                    example: current-secure-password
                    format: password
                    type: string
                new_password:
                    description: New password, at least 8 characters and at most 72 bytes as enforced by the backend.
                    example: replacement-password
                    format: password
                    maxLength: 72
                    minLength: 8
                    type: string
            required:
                - current_password
                - new_password
                - confirm_password
            type: object
        CompleteSetupRequest:
            properties:
                admin:
                    $ref: '#/components/schemas/SetupAdminInput'
                cloud:
                    $ref: '#/components/schemas/SetupCloudConfig'
                placement_strategy:
                    description: Storage placement strategy saved during setup.
                    example: balanced
                    type: string
                storage_nodes:
                    example:
                        - capacity_bytes: 1099511627776
                          enabled: true
                          path: /srv/cubycloud/storage/default
                    items:
                        $ref: '#/components/schemas/SetupStorageNodeInput'
                    type: array
            required:
                - admin
                - storage_nodes
                - placement_strategy
                - cloud
            type: object
        CompleteSetupResponse:
            properties:
                recovery_key:
                    description: The recovery key supplied for the administrator account.
                    example: ABCDE-FGHIJ-KLMNP-QRSTU-VWXYZ-23456
                    type: string
                redirect:
                    description: Client redirect path after setup.
                    example: /drive/home
                    type: string
            required:
                - recovery_key
                - redirect
            type: object
        CompressJobResponse:
            properties:
                job_id:
                    type: string
                status:
                    type: string
            required:
                - job_id
                - status
            type: object
        CreateAdminUserRequest:
            properties:
                email:
                    example: alice@example.com
                    format: email
                    type: string
                quota_gb:
                    example: 50
                    format: double
                    type: number
                quota_mode:
                    example: DEFAULT
                    type: string
                username:
                    example: alice
                    type: string
            required:
                - username
                - email
                - quota_mode
            type: object
        CreateCloudStorageNodeRequest:
            properties:
                access_key:
                    example: AKIAIOSFODNN7EXAMPLE
                    type: string
                bucket:
                    example: cubycloud-data
                    type: string
                capacity_cap_gb:
                    example: 2000
                    format: int64
                    type: integer
                enabled:
                    example: true
                    type: boolean
                endpoint:
                    example: https://s3.example.com
                    type: string
                name:
                    example: Offsite backup
                    type: string
                region:
                    example: us-east-1
                    type: string
                secret_key:
                    example: example-secret-key
                    format: password
                    type: string
            required:
                - name
                - endpoint
                - bucket
                - region
                - access_key
                - secret_key
                - capacity_cap_gb
                - enabled
            type: object
        CreateLocalStorageNodeRequest:
            properties:
                capacity_cap_gb:
                    example: 1000
                    format: int64
                    type: integer
                enabled:
                    example: true
                    type: boolean
                name:
                    example: Primary disk
                    type: string
                path:
                    example: /srv/cubycloud
                    type: string
            required:
                - name
                - path
                - capacity_cap_gb
                - enabled
            type: object
        CreateOrganizationFolderRequest:
            properties:
                name:
                    example: Finance
                    type: string
                parent_id:
                    example: null
                    type:
                        - string
                        - "null"
                unique_name:
                    description: When true, a conflicting name is changed to a unique name instead of returning a conflict.
                    example: false
                    type: boolean
            type: object
        CreateShareLinkRequest:
            properties:
                expires_days:
                    description: Expiry in days; supported values are 1, 7, 30, or 90. Null or omitted means no expiry.
                    enum:
                        - 1
                        - 7
                        - 30
                        - 90
                        - null
                    example: 7
                    type:
                        - integer
                        - "null"
                password:
                    description: Optional plaintext password; the server stores a hash.
                    example: spring-river-42
                    type: string
                permission:
                    $ref: '#/components/schemas/SharePermission'
            required:
                - permission
            type: object
        CreateShareLinkResponse:
            properties:
                link:
                    $ref: '#/components/schemas/ShareLink'
            required:
                - link
            type: object
        DeleteAdminUserRequest:
            properties:
                email:
                    example: alice@example.com
                    format: email
                    type: string
            required:
                - email
            type: object
        DetachStorageNodeRequest:
            properties:
                target_node_id:
                    description: Optional target node ID for the physical migration.
                    example: node-02
                    type: string
            type: object
        DetachStorageNodeResponse:
            properties:
                job_id:
                    example: job-123
                    type: string
                message:
                    example: Storage node detach started
                    type: string
                safe_to_disconnect:
                    example: false
                    type: boolean
            required:
                - message
                - safe_to_disconnect
            type: object
        DownloadURLResponse:
            properties:
                expires_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                filename:
                    type: string
                url:
                    format: uri
                    type:
                        - string
                        - "null"
            required:
                - url
                - filename
            type: object
        DriveHomeResponse:
            properties:
                activities:
                    items:
                        properties:
                            action:
                                enum:
                                    - upload
                                    - edit
                                type: string
                            created_at:
                                format: date-time
                                type: string
                            file_name:
                                type: string
                            id:
                                type: string
                            item_id:
                                type: string
                            item_kind:
                                type: string
                            source:
                                enum:
                                    - my-storage
                                    - organization
                                type: string
                        required:
                            - id
                            - action
                            - item_id
                            - file_name
                            - item_kind
                            - source
                            - created_at
                        type: object
                    type: array
                quick_access:
                    items:
                        properties:
                            accessed_at:
                                format: date-time
                                type: string
                            id:
                                type: string
                            kind:
                                type: string
                            name:
                                type: string
                            size_bytes:
                                format: int64
                                type: integer
                            source:
                                enum:
                                    - my-storage
                                    - organization
                                type: string
                        required:
                            - id
                            - name
                            - kind
                            - size_bytes
                            - source
                            - accessed_at
                        type: object
                    type: array
            required:
                - quick_access
                - activities
            type: object
        ErrorResponse:
            properties:
                error:
                    description: Error message describing why the request failed
                    example: Invalid credentials or unauthorized access
                    type: string
            required:
                - error
            type: object
        FolderCreateRequest:
            properties:
                name:
                    example: Invoices
                    type: string
                parent_id:
                    example: null
                    type:
                        - string
                        - "null"
                unique_name:
                    default: false
                    description: When true
                    resolve name collisions by selecting an available name.: null
                    type: boolean
            required:
                - name
            type: object
        FolderListResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Breadcrumb'
                    type: array
            required:
                - items
            type: object
        HealthResponse:
            properties:
                status:
                    enum:
                        - ok
                        - unavailable
                    example: ok
                    type: string
            required:
                - status
            type: object
        ItemListResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ItemResponse'
                    type: array
            required:
                - items
            type: object
        ItemResponse:
            properties:
                id:
                    example: 01JQ2Z5X7K9M3N4P6R8T0V1W2Y
                    type: string
                is_starred:
                    example: false
                    type: boolean
                kind:
                    enum:
                        - file
                        - folder
                    example: file
                    type: string
                modified_at:
                    example: "2026-02-14T10:30:00Z"
                    format: date-time
                    type: string
                name:
                    example: Project notes.pdf
                    type: string
                parent_id:
                    example: null
                    type:
                        - string
                        - "null"
                size_bytes:
                    example: 245760
                    format: int64
                    type: integer
                storage_available:
                    example: true
                    type: boolean
            required:
                - id
                - name
                - kind
                - size_bytes
                - parent_id
                - modified_at
                - is_starred
                - storage_available
            type: object
        ItemShares:
            properties:
                grants:
                    items:
                        $ref: '#/components/schemas/ShareGrant'
                    type: array
                links:
                    items:
                        $ref: '#/components/schemas/ShareLink'
                    type: array
            required:
                - grants
                - links
            type: object
        JobResponse:
            properties:
                completed_at:
                    example: null
                    format: date-time
                    type:
                        - string
                        - "null"
                created_at:
                    example: "2026-10-25T14:30:00Z"
                    format: date-time
                    type: string
                error_message:
                    example: null
                    type:
                        - string
                        - "null"
                id:
                    example: 01JGF83D0V2AKVGWN8W7NB9S43
                    type: string
                progress:
                    description: Job progress value reported by the worker.
                    example: 45
                    type: integer
                result:
                    description: Result decoded from JSON when possible
                    example: null
                    oneOf:
                        - additionalProperties: true
                          type: object
                        - items: {}
                          type: array
                        - type: string
                        - type: number
                        - type: boolean
                        - type: "null"
                    otherwise returned as a string.: null
                started_at:
                    example: "2026-10-25T14:31:00Z"
                    format: date-time
                    type:
                        - string
                        - "null"
                status:
                    enum:
                        - PENDING
                        - PROCESSING
                        - COMPLETED
                        - FAILED
                    example: PROCESSING
                    type: string
                type:
                    example: compress_zip
                    type: string
                user_id:
                    example: 01JGF7A3JX0XG3P1NACV53B9XQ
                    type: string
            required:
                - id
                - type
                - status
                - user_id
                - progress
                - created_at
            type: object
        LargestFileItem:
            properties:
                id:
                    type: string
                kind:
                    enum:
                        - file
                        - folder
                    type: string
                location:
                    type: string
                modified_at:
                    format: date-time
                    type: string
                name:
                    type: string
                parent_id:
                    type:
                        - string
                        - "null"
                size_bytes:
                    format: int64
                    type: integer
            required:
                - id
                - name
                - kind
                - size_bytes
                - parent_id
                - location
                - modified_at
            type: object
        LargestFilesResponse:
            properties:
                has_more:
                    type: boolean
                items:
                    items:
                        $ref: '#/components/schemas/LargestFileItem'
                    type: array
                next_offset:
                    type: integer
                total:
                    format: int64
                    type: integer
            required:
                - items
                - total
                - has_more
                - next_offset
            type: object
        LoginRequest:
            properties:
                identifier:
                    description: Username or email address.
                    example: admin
                    type: string
                password:
                    description: Account password.
                    example: correct-horse-battery
                    format: password
                    type: string
            required:
                - identifier
                - password
            type: object
        LoginResponse:
            properties:
                message:
                    example: login successful
                    type: string
                user:
                    $ref: '#/components/schemas/AuthUser'
            required:
                - user
                - message
            type: object
        LogoutResponse:
            properties:
                message:
                    example: logout successful
                    type: string
            required:
                - message
            type: object
        MessageResponse:
            properties:
                message:
                    description: Human-readable notification or confirmation message
                    example: Operation completed successfully
                    type: string
            required:
                - message
            type: object
        MoveItemRequest:
            properties:
                target_parent_id:
                    description: Target folder ID; null moves the item to the root.
                    type:
                        - string
                        - "null"
            type: object
        MoveItemResponse:
            allOf:
                - $ref: '#/components/schemas/ItemResponse'
        MoveSharedItemRequest:
            properties:
                target_parent_id:
                    example: item_01JDESTINATION
                    type: string
            required:
                - target_parent_id
            type: object
        MultipartCheckpointRequest:
            properties:
                parts:
                    items:
                        $ref: '#/components/schemas/MultipartPartUpdate'
                    type: array
            required:
                - parts
            type: object
        MultipartIntentRequest:
            allOf:
                - $ref: '#/components/schemas/UploadIntentRequest'
        MultipartIntentResponse:
            properties:
                expires_at:
                    format: date-time
                    type: string
                method:
                    type: string
                mode:
                    enum:
                        - local
                        - single_put
                        - multipart
                    type: string
                part_count:
                    format: int32
                    type: integer
                part_size_bytes:
                    format: int64
                    type: integer
                parts:
                    items:
                        $ref: '#/components/schemas/MultipartPartState'
                    type: array
                placement:
                    enum:
                        - local
                        - s3
                    type: string
                size_bytes:
                    format: int64
                    type: integer
                upload_id:
                    type: string
                url:
                    format: uri
                    type: string
            required:
                - placement
                - mode
            type: object
        MultipartPartState:
            properties:
                etag:
                    type: string
                part_number:
                    format: int32
                    type: integer
                size_bytes:
                    format: int64
                    type: integer
                status:
                    enum:
                        - pending
                        - completed
                        - failed
                    type: string
            required:
                - part_number
                - size_bytes
                - status
            type: object
        MultipartPartURL:
            properties:
                expires_at:
                    format: date-time
                    type: string
                part_number:
                    format: int32
                    type: integer
                url:
                    format: uri
                    type: string
            required:
                - part_number
                - url
                - expires_at
            type: object
        MultipartPartURLsRequest:
            properties:
                part_numbers:
                    description: Empty or omitted requests URLs for all incomplete parts.
                    items:
                        format: int32
                        type: integer
                    type: array
            type: object
        MultipartPartURLsResponse:
            properties:
                parts:
                    items:
                        $ref: '#/components/schemas/MultipartPartURL'
                    type: array
            required:
                - parts
            type: object
        MultipartPartUpdate:
            properties:
                etag:
                    type: string
                part_number:
                    format: int32
                    type: integer
                size_bytes:
                    format: int64
                    type: integer
                status:
                    enum:
                        - completed
                        - failed
                    type: string
            required:
                - part_number
                - size_bytes
                - status
