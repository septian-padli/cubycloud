                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                    invalid unlock: null
                    or password required: null
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The share link does not grant editor permission
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link or item not found in the shared tree
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
