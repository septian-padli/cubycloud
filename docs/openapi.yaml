            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Get Organization TUS resource capabilities
            tags:
                - Organization
        parameters:
            - description: TUS upload session ID.
              example: 01JGF83D0V2AKVGWN8W7NB9S43
              in: path
              name: id
              required: true
              schema:
                type: string
        patch:
            description: Appends the request body at `Upload-Offset`; the final chunk is checked and finalized as an organization item.
            operationId: appendOrganizationTusUploadChunk
            parameters:
                - in: header
                  name: Tus-Resumable
                  schema:
                    enum:
                        - 1.0.0
                    type: string
                - example: 65536
                  in: header
                  name: Upload-Offset
                  required: true
                  schema:
                    format: int64
                    minimum: 0
                    type: integer
                - description: Optional SHA-256 checksum.
                  example: sha256 47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=
                  in: header
                  name: Upload-Checksum
                  schema:
                    type: string
            requestBody:
                content:
                    application/offset+octet-stream:
                        schema:
                            format: binary
                            type: string
                required: true
            responses:
                "204":
                    description: Chunk accepted or upload finalized.
                    headers:
                        Tus-Resumable:
                            schema:
                                example: 1.0.0
                                type: string
                        Upload-Item:
                            schema:
                                $ref: '#/components/schemas/TusUploadItem'
                        Upload-Item-Id:
                            schema:
                                example: 01JGF9K7N3MEXZ45XPK1J1S2DX
                                type: string
                        Upload-Offset:
                            schema:
                                example: 204800
                                format: int64
                                type: integer
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid ID
                    offset: null
                    or checksum; or bytes exceed Upload-Length.: null
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Upload not found.
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Upload offset mismatch.
                    headers:
                        Upload-Offset:
                            schema:
                                format: int64
                                type: integer
                "412":
                    description: Unsupported TUS version.
                    headers:
                        Tus-Version:
                            schema:
                                example: 1.0.0
                                type: string
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Upload exceeds available capacity.
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Append an upload chunk
            tags:
                - Organization
