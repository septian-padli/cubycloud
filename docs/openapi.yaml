                - Jobs
    /api/v1/s/{token}:
        get:
            description: Public token access; authentication is not required. For a password-protected link without a valid unlock cookie, returns metadata with has_password true, unlocked false, and item_name, omitting item contents. When unlocked, returns the item and folder contents where applicable. The optional unlock cookie is set by the unlock endpoint.
            operationId: getPublicShare
            parameters:
                - description: ID of a folder within the shared tree to retrieve. Ignored while the link is locked.
                  example: item_01JSUBFOLDER
                  in: query
                  name: folder_id
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            examples:
                                passwordRequired:
                                    summary: Password-protected link before unlock
                                    value:
                                        has_password: true
                                        item_name: Shared project
                                        permission: viewer
                                        token: sh_7Kp4mN2x
                                        unlocked: false
                                unlockedFolder:
                                    summary: Unlocked folder share
                                    value:
                                        breadcrumbs:
                                            - id: item_01JROOT
                                              name: Shared project
                                        children:
                                            - id: item_01JFILE
                                              kind: file
                                              modified_at: "2026-10-24T16:30:00Z"
                                              name: overview.pdf
                                              parent_id: item_01JROOT
                                              size_bytes: 245760
                                        expires_at: "2026-11-01T12:00:00Z"
                                        has_password: true
                                        item:
                                            id: item_01JROOT
                                            kind: folder
                                            modified_at: "2026-10-24T16:30:00Z"
                                            name: Shared project
                                            parent_id: null
                                            size_bytes: 0
                                        permission: viewer
                                        token: sh_7Kp4mN2x
                                        unlocked: true
                            schema:
                                $ref: '#/components/schemas/PublicShareResponse'
                    description: Public link metadata, either password-locked or unlocked.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link or requested folder not found
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link has expired
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Failed to retrieve share
            security: []
            summary: Get public share metadata and contents
        parameters:
            - description: Public share link token.
              example: sh_7Kp4mN2x
              in: path
              name: token
              required: true
              schema:
                type: string
    /api/v1/s/{token}/download:
        get:
            description: Public token access; no login is required. Password-protected links require the unlock cookie. Returns file bytes (or a ZIP if the selected root item is a folder), with Content-Disposition and Content-Length when known for non-empty files.
            operationId: downloadPublicShareFile
            responses:
                "200":
                    content:
                        application/octet-stream:
                            schema:
                                format: binary
                                type: string
                        application/zip:
                            schema:
                                format: binary
                                type: string
                    description: File content or ZIP archive for a folder root.
                    headers:
                        Content-Disposition:
                            description: Attachment filename.
                            schema:
                                type: string
                        Content-Length:
                            description: Present for non-empty file downloads when known.
                            schema:
                                type: integer
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Password required or unlock cookie invalid
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link or requested file not found in the shared tree
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link has expired
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Download failed
            security: []
            summary: Download a file from a public share
        parameters:
            - description: Public share link token.
              example: sh_7Kp4mN2x
              in: path
              name: token
              required: true
              schema:
                type: string
            - description: ID of a file within the shared tree. If omitted, downloads the link's root item.
              example: item_01JFILE
              in: query
              name: file_id
              required: false
              schema:
                type: string
    /api/v1/s/{token}/download-zip:
        get:
            description: Public token access; no login is required. Password-protected links require the unlock cookie. Streams the selected folder as a ZIP attachment.
            operationId: downloadPublicShareZip
            responses:
                "200":
                    content:
                        application/zip:
                            schema:
                                format: binary
                                type: string
                    description: ZIP archive.
                    headers:
                        Content-Disposition:
                            description: Attachment filename.
                            schema:
                                type: string
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Password required or unlock cookie invalid
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link or requested folder not found in the shared tree
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link has expired
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Download failed
            security: []
            summary: Download a public shared folder as ZIP
        parameters:
            - description: Public share link token.
              example: sh_7Kp4mN2x
              in: path
              name: token
              required: true
              schema:
                type: string
            - description: ID of a folder within the shared tree to download as a ZIP. If omitted, downloads the shared root.
              example: item_01JSUBFOLDER
              in: query
              name: folder_id
              required: false
              schema:
                type: string
    /api/v1/s/{token}/folders:
        parameters:
            - description: Public share link token.
              example: sh_7Kp4mN2x
              in: path
              name: token
              required: true
              schema:
                type: string
        post:
            description: Requires an authenticated session, an editor-permission link, and an unlock cookie if the link is password-protected. Optional parent_id selects the destination folder; omitted or null parent_id targets the shared root.
            operationId: createPublicShareFolder
            requestBody:
                content:
                    application/json:
                        example:
                            name: Reports
                            parent_id: item_01JSUBFOLDER
                        schema:
                            properties:
                                name:
                                    example: Reports
                                    type: string
                                parent_id:
                                    example: item_01JSUBFOLDER
                                    type:
                                        - string
                                        - "null"
                            required:
                                - name
                            type: object
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SharedNode'
                    description: Folder created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Folder name is required
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                    invalid unlock: null
                    or password required: null
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The share link does not grant editor permission
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link or destination folder not found
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link has expired
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Folder creation failed
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Create a folder in a public share
