            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SharedNode'
                    description: Renamed item
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Name is required or the shared root cannot be renamed
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Authentication required
                    invalid unlock: null
                    or password required: null
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The share link does not grant editor permission
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link or item not found in the shared tree
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link has expired
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Rename failed
            security:
                - CookieAuth: []
                - BearerAuth: []
            summary: Rename an item in a public share
    /api/v1/s/{token}/unlock:
        parameters:
            - description: Public share link token.
              example: sh_7Kp4mN2x
              in: path
              name: token
              required: true
              schema:
                type: string
        post:
            description: Public token access; submit the share password to receive an HttpOnly unlock cookie scoped to this token. The endpoint is rate limited to 10 requests per minute.
            operationId: unlockPublicShare
            requestBody:
                content:
                    application/json:
                        example:
                            password: spring-river-42
                        schema:
                            $ref: '#/components/schemas/PublicUnlockRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                success: true
                                token: sh_7Kp4mN2x
                                unlocked: true
                            schema:
                                $ref: '#/components/schemas/PublicUnlockResponse'
                    description: Share unlocked; a scoped HttpOnly cookie is set when the link is password-protected, expiring no later than the link itself.
                    headers:
                        Set-Cookie:
                            description: Unlock cookie scoped to /api/v1/s/{token}.
                            schema:
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid request body
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid password
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link not found
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Share link has expired
                "429":
                    description: Rate limit exceeded (10 requests per minute)
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Failed to unlock share
            security: []
            summary: Unlock a password-protected share
    /api/v1/s/{token}/upload:
        parameters:
            - description: Public share link token.
              example: sh_7Kp4mN2x
              in: path
              name: token
              required: true
              schema:
                type: string
        post:
            description: Requires an authenticated session, an editor-permission link, and an unlock cookie if the link is password-protected. Uploads the first file part. Optional parent_id chooses a folder inside the shared tree; omitted parent_id targets the share root.
            operationId: uploadPublicShareFile
