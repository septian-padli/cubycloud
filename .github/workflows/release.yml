name: Release Automation

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g., v0.0.1-alpha.1)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-tag:
    name: Validate SemVer Tag Format
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve-tag.outputs.tag }}
      is_prerelease: ${{ steps.check-channel.outputs.is_prerelease }}
      channel: ${{ steps.check-channel.outputs.channel }}
    steps:
      - name: Resolve Target Tag
        id: resolve-tag
        run: |
          TARGET_TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT
          echo "Release target tag: $TARGET_TAG"

      - name: Validate SemVer Regex and Classify Channel
        id: check-channel
        run: |
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          # Regex for strict SemVer with alpha/beta/rc channels or stable
          SEMVER_REGEX='^v([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.([0-9]+))?$'
          if [[ ! "$TAG" =~ $SEMVER_REGEX ]]; then
            echo "ERROR: Tag '$TAG' does not conform to required SemVer format (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-(alpha|beta|rc).N)"
            exit 1
          fi

          PRERELEASE_KIND="${BASH_REMATCH[5]}"
          if [ -n "$PRERELEASE_KIND" ]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "channel=$PRERELEASE_KIND" >> $GITHUB_OUTPUT
            echo "Classified as PRERELEASE: channel=$PRERELEASE_KIND"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "Classified as STABLE release"
          fi

  pre-release-checks:
    name: Release Gate Checks
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/backend/go.mod'
          cache-dependency-path: apps/backend/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Backend Tests
        run: |
          cd apps/backend
          go test -race ./...

      - name: Run Frontend Quality Gates
        run: |
          cd apps/frontend
          bun install --frozen-lockfile
          bun run check
          bun run lint
          bun test src

  publish-docker-ghcr:
    name: Build & Push GHCR Container
    needs: [validate-tag, pre-release-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & tag rules
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate-tag.outputs.tag_name }}
            type=raw,value=latest,enable=${{ needs.validate-tag.outputs.is_prerelease == 'false' }}
            type=raw,value=${{ needs.validate-tag.outputs.channel }},enable=${{ needs.validate-tag.outputs.is_prerelease == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-github-release:
    name: Create GitHub Release & Changelog
    needs: [validate-tag, pre-release-checks, publish-docker-ghcr]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag_name }}
          name: CubyCloud ${{ needs.validate-tag.outputs.tag_name }}
          prerelease: ${{ needs.validate-tag.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          draft: false
          body: |
            ## CubyCloud ${{ needs.validate-tag.outputs.tag_name }}
            
            **Channel:** `${{ needs.validate-tag.outputs.channel }}`
            **Docker Image:** `ghcr.io/${{ github.repository }}:${{ needs.validate-tag.outputs.tag_name }}`
            
            ### Quick Start with Docker Compose
            ```yaml
            services:
              cubycloud:
                image: ghcr.io/${{ github.repository }}:${{ needs.validate-tag.outputs.tag_name }}
                restart: unless-stopped
                ports:
                  - "8383:8383"
                volumes:
                  - cubycloud_data:/app/data
            volumes:
              cubycloud_data:
            ```
