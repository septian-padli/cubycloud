services:
  cubycloud:
    image: ghcr.io/septian-padli/cubycloud:latest
    container_name: cubycloud
    restart: unless-stopped
    ports:
      - "${CUBYCLOUD_PORT:-8383}:8383"
    volumes:
      - cubycloud_data:/app/data
    environment:
      - ENV=production
      # HTTPS-only melalui reverse proxy: aktifkan COOKIE_SECURE=true.
      # Login HTTP dari LAN tidak akan bekerja bila cookie hanya dikirim lewat HTTPS.
      # - COOKIE_SECURE=true

volumes:
  cubycloud_data:
