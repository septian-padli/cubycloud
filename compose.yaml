services:
  cubycrate:
    # Until T7 publishes GHCR, set CUBYCRATE_IMAGE to a locally built image.
    image: ${CUBYCRATE_IMAGE:-cubycrate}:${CUBYCRATE_VERSION:-local}
    container_name: cubycrate
    restart: unless-stopped
    ports:
      - "${CUBYCRATE_PORT:-8383}:8383"
    volumes:
      - cubycrate_data:/app/data
    environment:
      - ENV=production
      - PORT=8383
      # Set COOKIE_SECURE=true when running behind an HTTPS reverse proxy
      # - COOKIE_SECURE=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8383/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  cubycrate_data:
    name: ${CUBYCRATE_VOLUME_NAME:-cubycrate_data}
