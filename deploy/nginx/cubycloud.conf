# Template Konfigurasi Nginx untuk CubyCloud
# Ganti drive.example.com dengan nama domain Anda.
# Pastikan jalur ssl_certificate dan ssl_certificate_key sesuai sertifikat TLS Anda.

upstream cubycloud_backend {
    server cubycloud:8383;
    keepalive 32;
}

# Redirect seluruh traffic HTTP ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name drive.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Server HTTPS utama
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drive.example.com;

    # Sertifikat TLS
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Batas ukuran payload file upload (default 10GB untuk file besar)
    client_max_body_size 10G;

    # Header keamanan HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Real-time Server-Sent Events (SSE) stream endpoint
    location = /api/v1/events {
        proxy_pass http://cubycloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nonaktifkan proxy buffering agar stream SSE real-time tidak tertahan
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Endpoint readiness & health check probe
    location ~ ^/(api/)?health$ {
        proxy_pass http://cubycloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Reverse proxy catch-all ke aplikasi CubyCloud
    location / {
        proxy_pass http://cubycloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Header WebSocket bila diperlukan
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Dukungan upload file besar via chunked transfer
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
